<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ValidRange Admin — Overview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    #login-box input { margin: 4px 0; display: block; }
    #status { margin-top: 12px; }
    #filters { margin-top: 16px; display: flex; gap: 12px; }
    #filters input { padding: 6px; flex: 1; }

    .group-card {
      border: 1px solid #ddd; border-radius: 8px; margin-top: 16px; padding: 16px;
    }
    .group-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .group-title .taxon-tag {
      font-size: 12px; font-weight: normal; background: #eef2ff; color: #3730a3;
      padding: 2px 8px; border-radius: 10px; margin-left: 8px;
    }
    .subsection { margin-top: 10px; }
    .subsection h4 { margin: 0 0 6px 0; font-size: 13px; color: #555; text-transform: uppercase; }
    .person-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-radius: 6px; font-size: 14px;
    }
    .person-row:nth-child(even) { background: #fafafa; }
    .person-main { }
    .person-meta { color: #777; font-size: 12px; }
    .download-btn { font-size: 12px; padding: 4px 8px; cursor: pointer; }
    .empty-note { color: #999; font-size: 13px; font-style: italic; }
  </style>
</head>
<body>
  <h1>ValidRange — Overview</h1>

  <div id="login-box">
    <p>Log in with your admin account:</p>
    <input id="login-email" type="email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="status"></div>

  <div id="filters" style="display:none;">
    <input id="filter-mountain" placeholder="Filter by mountain name...">
    <input id="filter-taxon" placeholder="Filter by taxon...">
  </div>

  <div id="groups-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script>
    const SUPABASE_URL = "https://xwvzlscjqcegzyrpxqby.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3dnpsc2NqcWNlZ3p5cnB4cWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTEyNTIsImV4cCI6MjEwNDk2NzI1Mn0.3-nYI2QDIfX4VS6JxUR7I1WmCbE7Wmi9klOwJ1Jn1sA";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById('status');
    const loginBoxEl = document.getElementById('login-box');
    const filtersEl = document.getElementById('filters');
    const containerEl = document.getElementById('groups-container');

    let allGroups = []; // [{ mountain_name, taxon, downloads: [...], uploads: [...] }]

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        statusEl.textContent = '❌ ' + error.message;
        return;
      }
      await checkAdminAndLoad();
    }

    async function checkAdminAndLoad() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) return; // stay on login screen

      const { data: profile, error: profileError } = await client
        .from('profiles')
        .select('is_admin')
        .eq('id', session.user.id)
        .single();

      if (profileError || !profile || !profile.is_admin) {
        statusEl.textContent = '🚫 This account does not have admin access.';
        return;
      }

      loginBoxEl.style.display = 'none';
      statusEl.textContent = 'Loading...';
      await loadData();
    }

    // Groups downloads + uploads together by "mountain||taxon" key
    async function loadData() {
      const [downloadsRes, submissionsRes] = await Promise.all([
        client.from('downloads')
          .select('mountain_name, taxon, downloaded_at, profiles(first_name, surname, institution, email)')
          .order('downloaded_at', { ascending: false }),
        client.from('submissions')
          .select('mountain_name, taxon, uploaded_at, file_path, profiles(first_name, surname, institution, email)')
          .order('uploaded_at', { ascending: false })
      ]);

      if (downloadsRes.error || submissionsRes.error) {
        statusEl.textContent = '❌ Could not load data: ' +
          (downloadsRes.error?.message || submissionsRes.error?.message);
        return;
      }

      const groupsMap = {}; // key -> { mountain_name, taxon, downloads: [], uploads: [] }

      function getGroup(mountain_name, taxon) {
        const key = `${mountain_name}||${taxon}`;
        if (!groupsMap[key]) {
          groupsMap[key] = { mountain_name, taxon, downloads: [], uploads: [] };
        }
        return groupsMap[key];
      }

      downloadsRes.data.forEach(row => {
        getGroup(row.mountain_name, row.taxon).downloads.push({
          first_name: row.profiles?.first_name || '(unknown)',
          surname: row.profiles?.surname || '',
          institution: row.profiles?.institution || '',
          email: row.profiles?.email || '',
          when: row.downloaded_at
        });
      });

      submissionsRes.data.forEach(row => {
        getGroup(row.mountain_name, row.taxon).uploads.push({
          first_name: row.profiles?.first_name || '(unknown)',
          surname: row.profiles?.surname || '',
          institution: row.profiles?.institution || '',
          email: row.profiles?.email || '',
          when: row.uploaded_at,
          file_path: row.file_path
        });
      });

      allGroups = Object.values(groupsMap).sort((a, b) =>
        String(a.mountain_name).localeCompare(String(b.mountain_name)) ||
        String(a.taxon).localeCompare(String(b.taxon))
      );

      statusEl.textContent = `${allGroups.length} mountain/taxon group(s) with activity.`;
      filtersEl.style.display = 'flex';
      renderGroups(allGroups);
    }

    function renderGroups(groups) {
      containerEl.innerHTML = '';

      if (groups.length === 0) {
        containerEl.innerHTML = '<p class="empty-note">No activity matches this filter.</p>';
        return;
      }

      groups.forEach(group => {
        const card = document.createElement('div');
        card.className = 'group-card';

        card.innerHTML = `
          <div class="group-title">${escapeHtml(group.mountain_name)}
            <span class="taxon-tag">${escapeHtml(group.taxon)}</span>
          </div>

          <div class="subsection">
            <h4>Downloaded by (${group.downloads.length})</h4>
            ${group.downloads.length === 0
              ? '<p class="empty-note">No one yet.</p>'
              : group.downloads.map(p => `
                <div class="person-row">
                  <span class="person-main">${escapeHtml(p.first_name)} ${escapeHtml(p.surname)} — ${escapeHtml(p.institution)} — ${escapeHtml(p.email)}</span>
                  <span class="person-meta">${new Date(p.when).toLocaleDateString()}</span>
                </div>
              `).join('')}
          </div>

          <div class="subsection">
            <h4>Uploaded by (${group.uploads.length})</h4>
            ${group.uploads.length === 0
              ? '<p class="empty-note">Nothing uploaded yet.</p>'
              : group.uploads.map(p => `
                <div class="person-row">
                  <span class="person-main">${escapeHtml(p.first_name)} ${escapeHtml(p.surname)} — ${escapeHtml(p.institution)} — ${escapeHtml(p.email)}</span>
                  <span class="person-meta">
                    ${new Date(p.when).toLocaleDateString()}
                    <button class="download-btn" data-path="${escapeHtml(p.file_path)}">Download</button>
                  </span>
                </div>
              `).join('')}
          </div>
        `;

        containerEl.appendChild(card);
      });

      containerEl.querySelectorAll('.download-btn').forEach(btn => {
        btn.addEventListener('click', () => downloadFile(btn.dataset.path));
      });
    }

    async function downloadFile(path) {
      const { data, error } = await client.storage
        .from('submissions')
        .createSignedUrl(path, 60);

      if (error) {
        alert('Could not generate download link: ' + error.message);
        return;
      }
      window.open(data.signedUrl, '_blank');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function applyFilters() {
      const mountainQuery = document.getElementById('filter-mountain').value.toLowerCase();
      const taxonQuery = document.getElementById('filter-taxon').value.toLowerCase();

      const filtered = allGroups.filter(g =>
        String(g.mountain_name).toLowerCase().includes(mountainQuery) &&
        String(g.taxon).toLowerCase().includes(taxonQuery)
      );
      renderGroups(filtered);
    }

    document.getElementById('filter-mountain').addEventListener('input', applyFilters);
    document.getElementById('filter-taxon').addEventListener('input', applyFilters);

    checkAdminAndLoad();
  </script>
</body>
</html>
