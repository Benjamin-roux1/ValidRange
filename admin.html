<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ValidRange Admin — Overview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
  <style>
    .dashboard-section { margin-top: 32px; }
    .dashboard-section h2 { font-size: 18px; margin-bottom: 10px; }
    .taxon-selector { margin-bottom: 14px; }
    .taxon-selector select { padding: 6px 10px; font-size: 14px; }
    .maps-row { display: flex; gap: 20px; flex-wrap: wrap; }
    .map-card { flex: 1; min-width: 320px; }
    .map-card h3 { font-size: 14px; margin: 0 0 6px 0; color: #444; }
    .map-card .map-box { height: 320px; border: 1px solid #ddd; border-radius: 8px; }
    .chart-box { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    body { font-family: sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .site-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px; margin-bottom: 10px;
    }
    .logo-row { display: flex; gap: 16px; align-items: center; }
    .logo-row img { height: 50px; width: auto; }

    #login-box { max-width: 360px; padding: 22px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; box-sizing: border-box; }
    #login-box h3 { margin-top: 0; }
    #login-box input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 5px; font: inherit; margin: 4px 0; display: block; }
    #login-box button { background: #2563eb; color: white; border: 1px solid #2563eb; border-radius: 5px; padding: 10px 16px; font: inherit; cursor: pointer; }
    #login-box button:hover { background: #1d4ed8; border-color: #1d4ed8; }

    #status { margin-top: 12px; }
    #filters { margin-top: 16px; display: flex; gap: 12px; }
    #filters input { padding: 6px; flex: 1; }

  </style>
</head>
<body>
  <div class="site-header">
    <h1>ValidRange — Overview</h1>
    <div class="logo-row">
      <img src="logos/nmbu_logo.png" alt="NMBU logo">
      <img src="logos/cmt_logo.png" alt="CMT logo">
      <img src="logos/gmba_logo.png" alt="GMBA logo">
      <img src="logos/MIM_full_logo.PNG" alt="MIM logo">
    </div>
  </div>

  <div id="login-box">
    <p>Log in with your admin account:</p>
    <input id="login-email" type="email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="status"></div>

  <div id="dashboard" style="display:none;">
    <div class="dashboard-section">
      <h2>Coverage maps</h2>
      <div class="taxon-selector">
        <label>Taxon: </label>
        <select id="map-taxon-select">
          <option value="all">All taxa</option>
          <option value="mammals">Mammals</option>
          <option value="birds">Birds</option>
          <option value="amphibians">Amphibians</option>
          <option value="reptiles">Reptiles</option>
        </select>
      </div>
      <div class="maps-row">
        <div class="map-card">
          <h3>Downloaded</h3>
          <div id="download-map" class="map-box"></div>
        </div>
        <div class="map-card">
          <h3>Uploaded</h3>
          <div id="upload-map" class="map-box"></div>
        </div>
      </div>
    </div>

    <div class="dashboard-section">
      <h2>Cumulative number of expert accounts created</h2>
      <div class="chart-box">
        <svg id="cumulative-chart" width="100%" height="260" viewBox="0 0 900 260"></svg>
      </div>
    </div>
  </div>

  <div id="filters" style="display:none;">
    <input id="filter-mountain" placeholder="Filter by mountain name...">
    <input id="filter-taxon" placeholder="Filter by taxon...">
  </div>

  <div id="table-container" style="display:none; max-height: 500px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; margin-top: 16px;">
    <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
      <thead>
        <tr style="position: sticky; top: 0; background: #f4f7f8;">
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">First name</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">Surname</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">Institution</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">ORCID</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">Email</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">Mountain</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">Taxon</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">Date downloaded</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">Date uploaded</th>
          <th style="text-align:left; padding:8px 10px; border-bottom:1px solid #ddd;">File</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script>
    const SUPABASE_URL = "https://xwvzlscjqcegzyrpxqby.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3dnpsc2NqcWNlZ3p5cnB4cWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTEyNTIsImV4cCI6MjEwNDk2NzI1Mn0.3-nYI2QDIfX4VS6JxUR7I1WmCbE7Wmi9klOwJ1Jn1sA";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById('status');
    const loginBoxEl = document.getElementById('login-box');
    const filtersEl = document.getElementById('filters');
    const tableBodyEl = document.getElementById('table-body');

    let allRows = []; // one row per expert, extended with a row per mountain/taxon they've engaged with

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        statusEl.textContent = '❌ ' + error.message;
        return;
      }
      await checkAdminAndLoad();
    }

    async function checkAdminAndLoad() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) return; // stay on login screen

      const { data: profile, error: profileError } = await client
        .from('profiles')
        .select('is_admin')
        .eq('id', session.user.id)
        .single();

      if (profileError || !profile || !profile.is_admin) {
        statusEl.textContent = '🚫 This account does not have admin access.';
        return;
      }

      loginBoxEl.style.display = 'none';
      statusEl.textContent = 'Loading...';
      await loadData();
    }

    async function loadData() {
      // One query gives us everything: every expert (even with zero activity),
      // extended with a row per mountain/taxon they've engaged with.
      const [activityRes, submissionsRes] = await Promise.all([
        client.from('expert_activity').select('*'),
        // Submissions still needed separately just for file_path (the view
        // only keeps the first-upload timestamp, not the file itself)
        client.from('submissions').select('user_id, mountain_id, taxon, file_path, uploaded_at')
      ]);

      if (activityRes.error) {
        statusEl.textContent = '❌ Could not load data: ' + activityRes.error.message;
        return;
      }

      // Keep only the most recent file per (user, mountain, taxon), in case of re-uploads
      const latestFileByKey = {};
      (submissionsRes.data || []).forEach(s => {
        const key = `${s.user_id}||${s.mountain_id}||${s.taxon}`;
        if (!latestFileByKey[key] || new Date(s.uploaded_at) > new Date(latestFileByKey[key].uploaded_at)) {
          latestFileByKey[key] = s;
        }
      });

      allRows = activityRes.data.map(r => {
        const key = `${r.user_id}||${r.mountain_id}||${r.taxon}`;
        return {
          user_id: r.user_id,
          first_name: r.first_name || '(unknown)',
          surname: r.surname || '',
          institution: r.institution || '',
          orcid: r.orcid || '',
          email: r.email || '',
          mountain_id: r.mountain_id,
          mountain_name: r.mountain_name,
          taxon: r.taxon,
          downloaded_at: r.first_downloaded_at,
          uploaded_at: r.first_uploaded_at,
          file_path: latestFileByKey[key]?.file_path || null,
          account_created_at: r.account_created_at
        };
      });

      // Sort: most recently active expert rows first, blanks (no activity) last
      allRows.sort((a, b) => {
        const aT = new Date(a.uploaded_at || a.downloaded_at || 0);
        const bT = new Date(b.uploaded_at || b.downloaded_at || 0);
        return bT - aT;
      });

      statusEl.textContent = `${allRows.length} row(s).`;
      filtersEl.style.display = 'flex';
      renderTable(allRows);
      document.getElementById('table-container').style.display = 'block';

      document.getElementById('dashboard').style.display = 'block';
      await loadDashboard();
    }

    function renderTable(rows) {
      if (rows.length === 0) {
        tableBodyEl.innerHTML = '<tr><td colspan="10" style="padding:14px; color:#999; font-style:italic;">No activity matches this filter.</td></tr>';
        return;
      }

      tableBodyEl.innerHTML = rows.map(r => `
        <tr style="border-bottom:1px solid #eee;">
          <td style="padding:7px 10px;">${escapeHtml(r.first_name)}</td>
          <td style="padding:7px 10px;">${escapeHtml(r.surname)}</td>
          <td style="padding:7px 10px;">${escapeHtml(r.institution)}</td>
          <td style="padding:7px 10px;">${escapeHtml(r.orcid || '—')}</td>
          <td style="padding:7px 10px;">${escapeHtml(r.email)}</td>
          <td style="padding:7px 10px;">${escapeHtml(r.mountain_name || '—')}</td>
          <td style="padding:7px 10px;">${escapeHtml(r.taxon || '—')}</td>
          <td style="padding:7px 10px; white-space:nowrap;">${r.downloaded_at ? new Date(r.downloaded_at).toLocaleDateString() : '—'}</td>
          <td style="padding:7px 10px; white-space:nowrap;">${r.uploaded_at ? new Date(r.uploaded_at).toLocaleDateString() : '—'}</td>
          <td style="padding:7px 10px;">${r.file_path ? `<button class="download-btn" data-path="${escapeHtml(r.file_path)}" style="font-size:12px; padding:4px 8px; cursor:pointer;">Download</button>` : ''}</td>
        </tr>
      `).join('');

      tableBodyEl.querySelectorAll('.download-btn').forEach(btn => {
        btn.addEventListener('click', () => downloadFile(btn.dataset.path));
      });
    }

    async function downloadFile(path) {
      const { data, error } = await client.storage
        .from('submissions')
        .createSignedUrl(path, 60);

      if (error) {
        alert('Could not generate download link: ' + error.message);
        return;
      }
      window.open(data.signedUrl, '_blank');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function applyFilters() {
      const mountainQuery = document.getElementById('filter-mountain').value.toLowerCase();
      const taxonQuery = document.getElementById('filter-taxon').value.toLowerCase();

      const filtered = allRows.filter(r =>
        String(r.mountain_name).toLowerCase().includes(mountainQuery) &&
        String(r.taxon).toLowerCase().includes(taxonQuery)
      );
      renderTable(filtered);
    }

    document.getElementById('filter-mountain').addEventListener('input', applyFilters);
    document.getElementById('filter-taxon').addEventListener('input', applyFilters);

    // ---- DASHBOARD: coverage maps + cumulative chart ----
    let downloadMap, uploadMap, downloadLayer, uploadLayer;
    let activityByMountain = {}; // mountain_id -> { downloaded: {taxon: count}, uploaded: {taxon: count} }
    let currentMaxCounts = { downloaded: 0, uploaded: 0 };
    let mapsInitialized = false;

    const DOWNLOAD_COLOR = '#53143A';
    const UPLOAD_COLOR = '#008571';
    const uncoveredStyle = { color: '#bbb', weight: 1, fillColor: '#eee', fillOpacity: 0.4 };

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    // Blends from near-white up to the full target color as t goes 0 → 1
    function tintColor(hex, t) {
      const [r, g, b] = hexToRgb(hex);
      const mix = c => Math.round(255 + (c - 255) * t);
      return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
    }

    async function loadDashboard() {
      // Build per-mountain, per-taxon counts of distinct experts who have
      // downloaded / uploaded, straight from the rows loadData() already fetched.
      activityByMountain = {};
      allRows.forEach(r => {
        if (!r.mountain_id) return; // skip the "no activity yet" rows
        if (!activityByMountain[r.mountain_id]) {
          activityByMountain[r.mountain_id] = { downloaded: {}, uploaded: {} };
        }
        const a = activityByMountain[r.mountain_id];
        if (r.downloaded_at) a.downloaded[r.taxon] = (a.downloaded[r.taxon] || 0) + 1;
        if (r.uploaded_at) a.uploaded[r.taxon] = (a.uploaded[r.taxon] || 0) + 1;
      });

      computeMaxCounts();

      if (!mapsInitialized) {
        await initMaps();
        mapsInitialized = true;
      } else {
        restyleMaps();
      }

      drawCumulativeChart();
    }

    function countFor(mountainId, type) {
      const taxon = document.getElementById('map-taxon-select').value;
      const activity = activityByMountain[mountainId];
      if (!activity) return 0;
      const counts = activity[type];
      return taxon === 'all'
        ? Object.values(counts).reduce((a, b) => a + b, 0)
        : (counts[taxon] || 0);
    }

    function computeMaxCounts() {
      let maxD = 0, maxU = 0;
      Object.keys(activityByMountain).forEach(mountainId => {
        maxD = Math.max(maxD, countFor(mountainId, 'downloaded'));
        maxU = Math.max(maxU, countFor(mountainId, 'uploaded'));
      });
      currentMaxCounts = { downloaded: maxD, uploaded: maxU };
    }

    async function initMaps() {
      downloadMap = L.map('download-map').setView([20, 0], 1);
      uploadMap = L.map('upload-map').setView([20, 0], 1);

      [downloadMap, uploadMap].forEach(m => {
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors', maxZoom: 10
        }).addTo(m);
      });

      const res = await fetch('gmba_mountains.geojson');
      const geojson = await res.json();

      downloadLayer = L.geoJSON(geojson, { style: f => styleForMountain(f, 'downloaded') }).addTo(downloadMap);
      uploadLayer = L.geoJSON(geojson, { style: f => styleForMountain(f, 'uploaded') }).addTo(uploadMap);

      downloadLayer.eachLayer(l => l.bindTooltip(() =>
        `${l.feature.properties.MapName} (${countFor(l.feature.properties.GMBA_V2_ID, 'downloaded')})`, { sticky: true }));
      uploadLayer.eachLayer(l => l.bindTooltip(() =>
        `${l.feature.properties.MapName} (${countFor(l.feature.properties.GMBA_V2_ID, 'uploaded')})`, { sticky: true }));

      document.getElementById('map-taxon-select').addEventListener('change', () => {
        computeMaxCounts();
        restyleMaps();
      });
    }

    function styleForMountain(feature, type) {
      const mountainId = feature.properties.GMBA_V2_ID;
      const count = countFor(mountainId, type);
      if (count === 0) return uncoveredStyle;

      const maxCount = currentMaxCounts[type];
      // Even a single download/upload gets a visible tint (floor of 0.3),
      // scaling up to full saturation at whichever mountain has the most.
      const t = 0.3 + 0.7 * (maxCount > 0 ? count / maxCount : 0);
      const baseColor = type === 'downloaded' ? DOWNLOAD_COLOR : UPLOAD_COLOR;

      return { color: baseColor, weight: 1, fillColor: tintColor(baseColor, t), fillOpacity: 0.85 };
    }

    function restyleMaps() {
      downloadLayer.eachLayer(l => l.setStyle(styleForMountain(l.feature, 'downloaded')));
      uploadLayer.eachLayer(l => l.setStyle(styleForMountain(l.feature, 'uploaded')));
      downloadLayer.eachLayer(l => l.setTooltipContent(`${l.feature.properties.MapName} (${countFor(l.feature.properties.GMBA_V2_ID, 'downloaded')})`));
      uploadLayer.eachLayer(l => l.setTooltipContent(`${l.feature.properties.MapName} (${countFor(l.feature.properties.GMBA_V2_ID, 'uploaded')})`));
    }

    // Cumulative count of expert ACCOUNTS over time (one point per distinct
    // user_id, at their account creation date) — drawn as a smooth curve
    // with a soft fading fill underneath, rather than a sharp stepped line.
    function drawCumulativeChart() {
      const seenUsers = new Set();
      const timestamps = [];
      allRows.forEach(r => {
        if (seenUsers.has(r.user_id) || !r.account_created_at) return;
        seenUsers.add(r.user_id);
        timestamps.push(new Date(r.account_created_at).getTime());
      });
      timestamps.sort((a, b) => a - b);

      const svg = document.getElementById('cumulative-chart');
      svg.innerHTML = '';

      if (timestamps.length === 0) {
        svg.innerHTML = '<text x="450" y="130" text-anchor="middle" fill="#999" font-size="14">No expert accounts yet.</text>';
        return;
      }

      const marginLeft = 50, marginBottom = 30, marginTop = 15, marginRight = 10;
      const width = 900, height = 260;
      const plotW = width - marginLeft - marginRight;
      const plotH = height - marginTop - marginBottom;

      const minT = timestamps[0], maxT = timestamps[timestamps.length - 1];
      const maxCount = timestamps.length;

      const xScale = t => marginLeft + (maxT === minT ? plotW / 2 : (t - minT) / (maxT - minT) * plotW);
      const yScale = c => marginTop + plotH - (c / maxCount) * plotH;

      // Points at each cumulative step (x = account creation time, y = running count)
      const pts = timestamps.map((t, i) => [xScale(t), yScale(i + 1)]);
      // Add a flat starting point so the curve begins at count 0
      pts.unshift([marginLeft, yScale(0)]);

      const ns = 'http://www.w3.org/2000/svg';
      function el(tag, attrs) {
        const e = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
        return e;
      }

      // Plain straight-line path connecting the actual cumulative points —
      // simple and unambiguous, no smoothing/interpolation involved.
      function linePathFrom(points) {
        return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]},${p[1]}`).join(' ');
      }

      const linePath = linePathFrom(pts);
      const baselineY = marginTop + plotH;
      const areaPath = `${linePath} L ${pts[pts.length - 1][0]},${baselineY} L ${pts[0][0]},${baselineY} Z`;

      // Gradient fill fading from the accent color down to transparent
      const defs = el('defs', {});
      const gradient = el('linearGradient', { id: 'fadeGradient', x1: '0', y1: '0', x2: '0', y2: '1' });
      gradient.appendChild(el('stop', { offset: '0%', 'stop-color': '#2f7a5f', 'stop-opacity': '0.55' }));
      gradient.appendChild(el('stop', { offset: '100%', 'stop-color': '#2f7a5f', 'stop-opacity': '0' }));
      defs.appendChild(gradient);
      svg.appendChild(defs);

      // Axes
      svg.appendChild(el('line', { x1: marginLeft, y1: marginTop, x2: marginLeft, y2: baselineY, stroke: '#ccc' }));
      svg.appendChild(el('line', { x1: marginLeft, y1: baselineY, x2: marginLeft + plotW, y2: baselineY, stroke: '#ccc' }));

      // Y-axis labels
      [0, Math.round(maxCount / 2), maxCount].forEach(c => {
        const t = el('text', { x: marginLeft - 8, y: yScale(c) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#555' });
        t.textContent = c;
        svg.appendChild(t);
      });

      // X-axis labels (first and last date)
      [minT, maxT].forEach(t => {
        const txt = el('text', { x: xScale(t), y: baselineY + 20, 'text-anchor': 'middle', 'font-size': 11, fill: '#555' });
        txt.textContent = new Date(t).toLocaleDateString();
        svg.appendChild(txt);
      });

      // Filled area (the "density" fade), then the smooth line on top
      svg.appendChild(el('path', { d: areaPath, fill: 'url(#fadeGradient)', stroke: 'none' }));
      svg.appendChild(el('path', { d: linePath, fill: 'none', stroke: '#2f7a5f', 'stroke-width': 2.5 }));
    }
    // ---- END DASHBOARD ----

    checkAdminAndLoad();
  </script>
</body>
</html>
