<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ValidRange Admin — Overview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
  <style>
    .dashboard-section { margin-top: 32px; }
    .dashboard-section h2 { font-size: 18px; margin-bottom: 10px; }
    .taxon-selector { margin-bottom: 14px; }
    .taxon-selector select { padding: 6px 10px; font-size: 14px; }
    .maps-row { display: flex; gap: 20px; flex-wrap: wrap; }
    .map-card { flex: 1; min-width: 320px; }
    .map-card h3 { font-size: 14px; margin: 0 0 6px 0; color: #444; }
    .map-card .map-box { height: 320px; border: 1px solid #ddd; border-radius: 8px; }
    .chart-box { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    body { font-family: sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    #login-box input { margin: 4px 0; display: block; }
    #status { margin-top: 12px; }
    #filters { margin-top: 16px; display: flex; gap: 12px; }
    #filters input { padding: 6px; flex: 1; }

    .group-card {
      border: 1px solid #ddd; border-radius: 8px; margin-top: 16px; padding: 16px;
    }
    .group-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .group-title .taxon-tag {
      font-size: 12px; font-weight: normal; background: #eef2ff; color: #3730a3;
      padding: 2px 8px; border-radius: 10px; margin-left: 8px;
    }
    .subsection { margin-top: 10px; }
    .subsection h4 { margin: 0 0 6px 0; font-size: 13px; color: #555; text-transform: uppercase; }
    .person-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-radius: 6px; font-size: 14px;
    }
    .person-row:nth-child(even) { background: #fafafa; }
    .person-main { }
    .person-meta { color: #777; font-size: 12px; }
    .download-btn { font-size: 12px; padding: 4px 8px; cursor: pointer; }
    .empty-note { color: #999; font-size: 13px; font-style: italic; }
  </style>
</head>
<body>
  <h1>ValidRange — Overview</h1>

  <div id="login-box">
    <p>Log in with your admin account:</p>
    <input id="login-email" type="email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="status"></div>

  <div id="dashboard" style="display:none;">
    <div class="dashboard-section">
      <h2>Coverage maps</h2>
      <div class="taxon-selector">
        <label>Taxon: </label>
        <select id="map-taxon-select">
          <option value="all">All taxa</option>
          <option value="mammals">Mammals</option>
          <option value="birds">Birds</option>
          <option value="amphibians">Amphibians</option>
          <option value="reptiles">Reptiles</option>
        </select>
      </div>
      <div class="maps-row">
        <div class="map-card">
          <h3>Downloaded</h3>
          <div id="download-map" class="map-box"></div>
        </div>
        <div class="map-card">
          <h3>Uploaded</h3>
          <div id="upload-map" class="map-box"></div>
        </div>
      </div>
    </div>

    <div class="dashboard-section">
      <h2>Cumulative experts who have uploaded at least one checklist</h2>
      <div class="chart-box">
        <svg id="cumulative-chart" width="100%" height="260" viewBox="0 0 900 260"></svg>
      </div>
    </div>
  </div>

  <div id="filters" style="display:none;">
    <input id="filter-mountain" placeholder="Filter by mountain name...">
    <input id="filter-taxon" placeholder="Filter by taxon...">
  </div>

  <div id="groups-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script>
    const SUPABASE_URL = "https://xwvzlscjqcegzyrpxqby.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3dnpsc2NqcWNlZ3p5cnB4cWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTEyNTIsImV4cCI6MjEwNDk2NzI1Mn0.3-nYI2QDIfX4VS6JxUR7I1WmCbE7Wmi9klOwJ1Jn1sA";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById('status');
    const loginBoxEl = document.getElementById('login-box');
    const filtersEl = document.getElementById('filters');
    const containerEl = document.getElementById('groups-container');

    let allGroups = []; // [{ mountain_name, taxon, downloads: [...], uploads: [...] }]

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        statusEl.textContent = '❌ ' + error.message;
        return;
      }
      await checkAdminAndLoad();
    }

    async function checkAdminAndLoad() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) return; // stay on login screen

      const { data: profile, error: profileError } = await client
        .from('profiles')
        .select('is_admin')
        .eq('id', session.user.id)
        .single();

      if (profileError || !profile || !profile.is_admin) {
        statusEl.textContent = '🚫 This account does not have admin access.';
        return;
      }

      loginBoxEl.style.display = 'none';
      statusEl.textContent = 'Loading...';
      await loadData();
    }

    // Groups downloads + uploads together by "mountain||taxon" key
    async function loadData() {
      const [downloadsRes, submissionsRes] = await Promise.all([
        client.from('downloads')
          .select('mountain_name, taxon, downloaded_at, profiles(first_name, surname, institution, orcid, email)')
          .order('downloaded_at', { ascending: false }),
        client.from('submissions')
          .select('mountain_name, taxon, uploaded_at, file_path, profiles(first_name, surname, institution, orcid, email)')
          .order('uploaded_at', { ascending: false })
      ]);

      if (downloadsRes.error || submissionsRes.error) {
        statusEl.textContent = '❌ Could not load data: ' +
          (downloadsRes.error?.message || submissionsRes.error?.message);
        return;
      }

      const groupsMap = {}; // key -> { mountain_name, taxon, downloads: [], uploads: [] }

      function getGroup(mountain_name, taxon) {
        const key = `${mountain_name}||${taxon}`;
        if (!groupsMap[key]) {
          groupsMap[key] = { mountain_name, taxon, downloads: [], uploads: [] };
        }
        return groupsMap[key];
      }

      downloadsRes.data.forEach(row => {
        getGroup(row.mountain_name, row.taxon).downloads.push({
          first_name: row.profiles?.first_name || '(unknown)',
          surname: row.profiles?.surname || '',
          institution: row.profiles?.institution || '',
          orcid: row.profiles?.orcid || '',
          email: row.profiles?.email || '',
          when: row.downloaded_at
        });
      });

      submissionsRes.data.forEach(row => {
        getGroup(row.mountain_name, row.taxon).uploads.push({
          first_name: row.profiles?.first_name || '(unknown)',
          surname: row.profiles?.surname || '',
          institution: row.profiles?.institution || '',
          orcid: row.profiles?.orcid || '',
          email: row.profiles?.email || '',
          when: row.uploaded_at,
          file_path: row.file_path
        });
      });

      allGroups = Object.values(groupsMap).sort((a, b) =>
        String(a.mountain_name).localeCompare(String(b.mountain_name)) ||
        String(a.taxon).localeCompare(String(b.taxon))
      );

      statusEl.textContent = `${allGroups.length} mountain/taxon group(s) with activity.`;
      filtersEl.style.display = 'flex';
      renderGroups(allGroups);

      document.getElementById('dashboard').style.display = 'block';
      await loadDashboard();
    }

    function renderGroups(groups) {
      containerEl.innerHTML = '';

      if (groups.length === 0) {
        containerEl.innerHTML = '<p class="empty-note">No activity matches this filter.</p>';
        return;
      }

      groups.forEach(group => {
        const card = document.createElement('div');
        card.className = 'group-card';

        card.innerHTML = `
          <div class="group-title">${escapeHtml(group.mountain_name)}
            <span class="taxon-tag">${escapeHtml(group.taxon)}</span>
          </div>

          <div class="subsection">
            <h4>Downloaded by (${group.downloads.length})</h4>
            ${group.downloads.length === 0
              ? '<p class="empty-note">No one yet.</p>'
              : group.downloads.map(p => `
                <div class="person-row">
                  <span class="person-main">${escapeHtml(p.first_name)} ${escapeHtml(p.surname)} — ${escapeHtml(p.institution)} — ORCID: ${escapeHtml(p.orcid || '—')} — ${escapeHtml(p.email)}</span>
                  <span class="person-meta">${new Date(p.when).toLocaleDateString()}</span>
                </div>
              `).join('')}
          </div>

          <div class="subsection">
            <h4>Uploaded by (${group.uploads.length})</h4>
            ${group.uploads.length === 0
              ? '<p class="empty-note">Nothing uploaded yet.</p>'
              : group.uploads.map(p => `
                <div class="person-row">
                  <span class="person-main">${escapeHtml(p.first_name)} ${escapeHtml(p.surname)} — ${escapeHtml(p.institution)} — ORCID: ${escapeHtml(p.orcid || '—')} — ${escapeHtml(p.email)}</span>
                  <span class="person-meta">
                    ${new Date(p.when).toLocaleDateString()}
                    <button class="download-btn" data-path="${escapeHtml(p.file_path)}">Download</button>
                  </span>
                </div>
              `).join('')}
          </div>
        `;

        containerEl.appendChild(card);
      });

      containerEl.querySelectorAll('.download-btn').forEach(btn => {
        btn.addEventListener('click', () => downloadFile(btn.dataset.path));
      });
    }

    async function downloadFile(path) {
      const { data, error } = await client.storage
        .from('submissions')
        .createSignedUrl(path, 60);

      if (error) {
        alert('Could not generate download link: ' + error.message);
        return;
      }
      window.open(data.signedUrl, '_blank');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function applyFilters() {
      const mountainQuery = document.getElementById('filter-mountain').value.toLowerCase();
      const taxonQuery = document.getElementById('filter-taxon').value.toLowerCase();

      const filtered = allGroups.filter(g =>
        String(g.mountain_name).toLowerCase().includes(mountainQuery) &&
        String(g.taxon).toLowerCase().includes(taxonQuery)
      );
      renderGroups(filtered);
    }

    document.getElementById('filter-mountain').addEventListener('input', applyFilters);
    document.getElementById('filter-taxon').addEventListener('input', applyFilters);

    // ---- DASHBOARD: coverage maps + cumulative chart ----
    let downloadMap, uploadMap, downloadLayer, uploadLayer;
    let activityByMountain = {}; // mountain_id -> { downloaded: Set(taxon), uploaded: Set(taxon) }
    let mapsInitialized = false;

    const coveredStyle = { color: '#2f7a5f', weight: 1, fillColor: '#2f7a5f', fillOpacity: 0.6 };
    const uncoveredStyle = { color: '#bbb', weight: 1, fillColor: '#eee', fillOpacity: 0.4 };

    async function loadDashboard() {
      // Pull the status matrix: one row per (expert, mountain, taxon) with activity
      const { data, error } = await client
        .from('expert_activity')
        .select('user_id, mountain_id, taxon, downloaded, uploaded, first_uploaded_at');

      if (error) {
        console.error('Could not load expert_activity:', error.message);
        return;
      }

      // Build per-mountain sets of which taxa have been downloaded/uploaded
      activityByMountain = {};
      data.forEach(row => {
        if (!activityByMountain[row.mountain_id]) {
          activityByMountain[row.mountain_id] = { downloaded: new Set(), uploaded: new Set() };
        }
        if (row.downloaded) activityByMountain[row.mountain_id].downloaded.add(row.taxon);
        if (row.uploaded) activityByMountain[row.mountain_id].uploaded.add(row.taxon);
      });

      if (!mapsInitialized) {
        await initMaps();
        mapsInitialized = true;
      } else {
        restyleMaps();
      }

      drawCumulativeChart(data);
    }

    async function initMaps() {
      downloadMap = L.map('download-map').setView([20, 0], 1);
      uploadMap = L.map('upload-map').setView([20, 0], 1);

      [downloadMap, uploadMap].forEach(m => {
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors', maxZoom: 10
        }).addTo(m);
      });

      const res = await fetch('gmba_mountains.geojson');
      const geojson = await res.json();

      downloadLayer = L.geoJSON(geojson, { style: f => styleForMountain(f, 'downloaded') }).addTo(downloadMap);
      uploadLayer = L.geoJSON(geojson, { style: f => styleForMountain(f, 'uploaded') }).addTo(uploadMap);

      downloadLayer.eachLayer(l => l.bindTooltip(l.feature.properties.MapName, { sticky: true }));
      uploadLayer.eachLayer(l => l.bindTooltip(l.feature.properties.MapName, { sticky: true }));

      document.getElementById('map-taxon-select').addEventListener('change', restyleMaps);
    }

    function styleForMountain(feature, type) {
      const taxon = document.getElementById('map-taxon-select').value;
      const activity = activityByMountain[feature.properties.GMBA_V2_ID];
      if (!activity) return uncoveredStyle;

      const covered = taxon === 'all' ? activity[type].size > 0 : activity[type].has(taxon);
      return covered ? coveredStyle : uncoveredStyle;
    }

    function restyleMaps() {
      downloadLayer.eachLayer(l => l.setStyle(styleForMountain(l.feature, 'downloaded')));
      uploadLayer.eachLayer(l => l.setStyle(styleForMountain(l.feature, 'uploaded')));
    }

    // Cumulative count of DISTINCT experts who have uploaded at least one
    // checklist, over time — using each expert's EARLIEST upload across all
    // their mountain/taxon combinations as the point they "became" an uploader.
    function drawCumulativeChart(activityRows) {
      const firstUploadByUser = {};
      activityRows.forEach(row => {
        if (!row.uploaded || !row.first_uploaded_at) return;
        const t = new Date(row.first_uploaded_at).getTime();
        if (!firstUploadByUser[row.user_id] || t < firstUploadByUser[row.user_id]) {
          firstUploadByUser[row.user_id] = t;
        }
      });

      const timestamps = Object.values(firstUploadByUser).sort((a, b) => a - b);
      const svg = document.getElementById('cumulative-chart');
      svg.innerHTML = '';

      if (timestamps.length === 0) {
        svg.innerHTML = '<text x="450" y="130" text-anchor="middle" fill="#999" font-size="14">No uploads yet.</text>';
        return;
      }

      const marginLeft = 50, marginBottom = 30, marginTop = 10, marginRight = 10;
      const width = 900, height = 260;
      const plotW = width - marginLeft - marginRight;
      const plotH = height - marginTop - marginBottom;

      const minT = timestamps[0], maxT = timestamps[timestamps.length - 1];
      const maxCount = timestamps.length;

      const xScale = t => marginLeft + (maxT === minT ? plotW / 2 : (t - minT) / (maxT - minT) * plotW);
      const yScale = c => marginTop + plotH - (c / maxCount) * plotH;

      // Step-shaped cumulative line: flat, then a vertical jump at each new upload
      let points = [];
      timestamps.forEach((t, i) => {
        const x = xScale(t);
        const yBefore = yScale(i);       // count before this person
        const yAfter = yScale(i + 1);    // count after this person
        points.push(`${x},${yBefore}`);
        points.push(`${x},${yAfter}`);
      });
      points.push(`${xScale(maxT) + 0.01},${yScale(maxCount)}`);

      const ns = 'http://www.w3.org/2000/svg';
      function el(tag, attrs) {
        const e = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
        return e;
      }

      // Axes
      svg.appendChild(el('line', { x1: marginLeft, y1: marginTop, x2: marginLeft, y2: marginTop + plotH, stroke: '#ccc' }));
      svg.appendChild(el('line', { x1: marginLeft, y1: marginTop + plotH, x2: marginLeft + plotW, y2: marginTop + plotH, stroke: '#ccc' }));

      // Y-axis labels (0, mid, max)
      [0, Math.round(maxCount / 2), maxCount].forEach(c => {
        svg.appendChild(el('text', { x: marginLeft - 8, y: yScale(c) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#555' })).textContent = c;
      });

      // X-axis labels (first and last date)
      [minT, maxT].forEach(t => {
        const label = new Date(t).toLocaleDateString();
        const x = xScale(t);
        const txt = el('text', { x, y: marginTop + plotH + 20, 'text-anchor': 'middle', 'font-size': 11, fill: '#555' });
        txt.textContent = label;
        svg.appendChild(txt);
      });

      // The line itself
      svg.appendChild(el('polyline', { points: points.join(' '), fill: 'none', stroke: '#2f7a5f', 'stroke-width': 2 }));
    }
    // ---- END DASHBOARD ----

    checkAdminAndLoad();
  </script>
</body>
</html>
